<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证书</title>
    <meta name="keywords" content="培训考试证书">
    <meta name="description" content="杰而杰培训考试证书页面">
    <style type="text/css">
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
        }
    </style>
</head>

<body bgcolor="#e0e0e0" width="600px" style="margin: 0;">
    <table bgcolor="#e0e0e0" cellpadding="0" cellspacing="0" border="0" height="100%" width="100%"
        style="border-collapse:collapse;">
        <tr>
            <td>
           	 	<center>
            
		            <table cellspacing="0" cellpadding="0" border="0" align="center" width="600px" bgcolor="#ffffff" style="background-repeat: repeat; background-position: center top; background-image: url('https://ossgonzige.oss-cn-shanghai.aliyuncs.com/images/2024-logo-bg-cn1.png');">
		
						<!-- logo -->
						<tr>
							<td valign="middle">
								<table align="center" border="0" cellpadding="0" cellspacing="0" width="100%">
									<tr>
										<td width="100%" valign="middle" style="text-align: center; font-family: sans-serif; font-size: 48px; mso-height-rule: exactly; line-height: 20px; color: #ffffff;height:100px;font-weight: bold;">
											<div style="color:#000">证书</div>
										</td>
									  </tr>
								 </table>
								<table align="center" border="0" cellpadding="0" cellspacing="0" width="90%" style="border-bottom: 0px solid #EAECF0">
									<tr>
										<td width="75%" valign="left" style="text-align: left; font-family: sans-serif; font-size: 18px; mso-height-rule: exactly; line-height: 20px; color: #000;height:40px;padding-left: 15px">
											
										</td>
										<td width="25%" valign="left" style="text-align: right; font-family: sans-serif; font-size: 18px; mso-height-rule: exactly; line-height: 20px; color: #000;height:40px;padding-right: 15px">
											<span>编号：</span><span>{sn}</span>
										</td>
									  </tr>
								 </table>
								<table align="center" border="0" cellpadding="0" cellspacing="0" width="90%" style="border-bottom: 0px solid #EAECF0">
									<tr>
										<td width="75%" valign="left" style="text-align: left; font-family: sans-serif; font-size: 18px; mso-height-rule: exactly; line-height: 20px; color: #000;height:40px;padding-left: 15px">
											<span style="color:#0070FF;text-decoration: underline;text-underline-offset: 0.5em;">{employeeName}</span><span style="margin-left:10px">:</span>
										</td>
										<td width="25%" valign="left" style="text-align: right; font-family: sans-serif; font-size: 18px; mso-height-rule: exactly; line-height: 20px; color: #000;height:40px;padding-right: 15px">
											
										</td>
									  </tr>
								 </table>
								 <table bgcolor="#FCFCFD" align="center" border="0" cellpadding="0" cellspacing="0" width="90%" style="border-bottom: 0px solid #EAECF0">
									<tr>
										<td colspan="2" width="100%" valign="left" style="text-align: left; font-family: sans-serif; font-size: 18px; mso-height-rule: exactly; line-height: 20px; color: #000;height:75px;padding-left: 50px">
											<span>您已参加试卷《{examName}》培训考试合格，特发此证。</span>
										</td>
									  </tr>
								 </table>
								 <table align="center" border="0" cellpadding="0" cellspacing="0" width="90%" style="border-bottom: 1px solid #EAECF0">
									<tr>
										<td width="100%" valign="right" style="text-align: right; font-family: sans-serif; font-size: 18px; mso-height-rule: exactly; line-height: 20px; color: #1B1F26B8;height:100px;padding-left: 15px">
											<p>{org}</p>
											<p>{createdAt}</p>
										</td>
									  </tr>
								 </table>
							</td>
						</tr>
						
					</table>
					
            	</center>
            </td>
        </tr>
    </table>
</body>

</html>
